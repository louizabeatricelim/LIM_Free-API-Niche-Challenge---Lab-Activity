<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShelfSearch — Book Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#" class="brand" id="brand-link">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">ShelfSearch</span>
      </a>
      <p class="tagline">Find books by title, author, or genre</p>
    </div>
  </header>

  <section class="search-hero">
    <div class="wrap">
      <h1 class="hero-title">Search the shelves</h1>
      <p class="hero-sub">Look up titles and authors, filter by genre or year, or browse explorer lists.</p>

      <form class="search-form" id="search-form" autocomplete="off">
        <div class="search-row">
          <label class="sr-only" for="search-input">Search books</label>
          <input
            type="search"
            id="search-input"
            name="q"
            placeholder="Search by title or author…"
          />
          <label class="sr-only" for="search-mode">Search by</label>
          <select id="search-mode" name="mode" aria-label="Search by">
            <option value="all">All</option>
            <option value="title">Title</option>
            <option value="author">Author</option>
          </select>
          <button type="submit" class="btn btn-primary">Search</button>
        </div>

        <div class="filters-row">
          <div class="filter-field">
            <label for="genre-filter">Genre</label>
            <select id="genre-filter" name="genre">
              <option value="">Any genre</option>
              <option value="Fiction">Fiction</option>
              <option value="Science">Science</option>
              <option value="History">History</option>
              <option value="Biography">Biography</option>
              <option value="Technology">Technology</option>
              <option value="Mystery">Mystery</option>
              <option value="Young Adult">Young Adult</option>
              <option value="Self-Help">Self-Help</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="year-filter">Publication year</label>
            <input
              type="number"
              id="year-filter"
              name="year"
              placeholder="e.g. 2020"
              min="1000"
              max="2100"
            />
          </div>
          <button type="button" class="btn btn-ghost" id="clear-filters">Clear filters</button>
        </div>
      </form>
    </div>
  </section>

  <section class="explorer" aria-labelledby="explorer-heading">
    <div class="wrap">
      <h2 id="explorer-heading" class="section-title">Library Explorer</h2>
      <p class="section-sub" id="explorer-sub">
        Browse curated subject lists — newest picks from Google Books.
      </p>
      <div class="explorer-field">
        <label for="explorer-select">Subject</label>
        <select id="explorer-select">
          <option value="">Choose a subject…</option>
        </select>
      </div>
    </div>
  </section>

  <main class="results-section" aria-labelledby="results-heading">
    <div class="wrap">
      <div class="results-header">
        <h2 id="results-heading" class="section-title">Results</h2>
        <p class="results-meta" id="results-meta"></p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="book-grid" id="book-grid"></div>
    </div>
  </main>

  <div class="modal" id="book-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>Powered by the <a href="https://developers.google.com/books" target="_blank" rel="noopener noreferrer">Google Books API</a></p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
